<svg xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml" width="880" height="320" viewBox="0 0 880 320">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="background:#F6EEDD;width:100%;height:100%;box-sizing:border-box;padding:22px;font-family:Arial,sans-serif;">
      <div style="background:#FDF8EC;border:3px solid #000;border-radius:16px;box-shadow:6px 6px 0 #000;overflow:hidden;">
        <div style="background:#000;padding:12px 16px;display:flex;align-items:center;gap:8px;border-bottom:3px solid #000;">
          <span style="width:12px;height:12px;border-radius:50%;background:#FD6A5A;border:2px solid #000;display:inline-block;"></span>
          <span style="width:12px;height:12px;border-radius:50%;background:#F2A93B;border:2px solid #000;display:inline-block;"></span>
          <span style="width:12px;height:12px;border-radius:50%;background:#B6E388;border:2px solid #000;display:inline-block;"></span>
          <span style="font-family:'Courier New',monospace;font-size:12px;color:#F6EEDD;letter-spacing:1px;margin-left:8px;">top languages — real repo data</span>
        </div>
        <div style="padding:20px 22px;font-family:'Courier New',monospace;font-size:13px;font-weight:bold;color:#000;">
          <div style="display:flex;align-items:center;margin-bottom:12px;">
            <span style="width:110px;">TYPESCRIPT</span>
            <div style="flex:1;height:22px;background:#F6EEDD;border:2px solid #000;"><div style="height:100%;width:33%;background:#9DB8E8;border-right:2px solid #000;"></div></div>
            <span style="width:70px;text-align:right;">3 repos</span>
          </div>
          <div style="display:flex;align-items:center;margin-bottom:12px;">
            <span style="width:110px;">JAVASCRIPT</span>
            <div style="flex:1;height:22px;background:#F6EEDD;border:2px solid #000;"><div style="height:100%;width:22%;background:#F2A93B;border-right:2px solid #000;"></div></div>
            <span style="width:70px;text-align:right;">2 repos</span>
          </div>
          <div style="display:flex;align-items:center;margin-bottom:12px;">
            <span style="width:110px;">PYTHON</span>
            <div style="flex:1;height:22px;background:#F6EEDD;border:2px solid #000;"><div style="height:100%;width:22%;background:#B6E388;border-right:2px solid #000;"></div></div>
            <span style="width:70px;text-align:right;">2 repos</span>
          </div>
          <div style="display:flex;align-items:center;margin-bottom:12px;">
            <span style="width:110px;">HTML</span>
            <div style="flex:1;height:22px;background:#F6EEDD;border:2px solid #000;"><div style="height:100%;width:11%;background:#FD6A5A;border-right:2px solid #000;"></div></div>
            <span style="width:70px;text-align:right;">1 repo</span>
          </div>
          <div style="display:flex;align-items:center;margin-bottom:12px;">
            <span style="width:110px;">JAVA</span>
            <div style="flex:1;height:22px;background:#F6EEDD;border:2px solid #000;"><div style="height:100%;width:11%;background:#F4A8D0;border-right:2px solid #000;"></div></div>
            <span style="width:70px;text-align:right;">1 repo</span>
          </div>
          <div style="display:flex;align-items:center;">
            <span style="width:110px;">C++</span>
            <div style="flex:1;height:22px;background:#F6EEDD;border:2px solid #000;"><div style="height:100%;width:11%;background:#C7A8F5;border-right:2px solid #000;"></div></div>
            <span style="width:70px;text-align:right;">1 repo</span>
          </div>
        </div>
      </div>
